services:
  postgres:
    image: postgres:16
    container_name: aguafix-api-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret123
      - POSTGRES_DB=aguafixdb
    volumes:
      - aguafix_postgres_data:/var/lib/postgresql/data

volumes:
  aguafix_postgres_data:
